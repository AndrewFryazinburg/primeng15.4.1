name: Deploy to GitHub Pages

on:
  push:
    branches:
      - production-pages # Триггер при пуше в вашу рабочую ветку

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x # Angular 15 стабильно работает на Node 18

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Library Assets
        # Перед сборкой документации нужно подготовить ресурсы самой библиотеки
        run: npm run build:lib

      - name: Build Application for Pages
        run: npm run build:pages

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/primeng/browser # Стандартный путь вывода клиентской сборки Angular 15 с настроенным SSR
          branch: gh-pages # Ветка, в которую запишется статика
